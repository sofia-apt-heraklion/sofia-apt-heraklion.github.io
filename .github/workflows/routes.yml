name: Build routes

on:
  workflow_dispatch:          # "Run workflow" button
  push:
    paths:
      - "js/places.js"        # rebuild when places change

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute routes from the apartments to every place
        run: python3 scripts/build_routes.py
      - name: Save if changed
        run: |
          git config user.name "routes-bot"
          git config user.email "routes-bot@users.noreply.github.com"
          git add routes.json
          git diff --cached --quiet || (git commit -m "Update routes" && git pull --rebase && git push)
