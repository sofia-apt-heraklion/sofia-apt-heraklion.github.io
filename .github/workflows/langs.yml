name: Build language pages

on:
  workflow_dispatch:          # "Run workflow" button
  push:
    paths:
      - "index.html"          # rebuild el/ de/ fr/ it/ when the main page
      - "js/i18n.js"          # or the translations change
      - "scripts/build_langs.js"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build el/ de/ fr/ it/ from index.html
        run: node scripts/build_langs.js
      - name: Save if changed
        run: |
          git config user.name "langs-bot"
          git config user.email "langs-bot@users.noreply.github.com"
          git add el de fr it
          git diff --cached --quiet || (git commit -m "Update language pages" && git pull --rebase && git push)
